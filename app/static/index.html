<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print Studio</title>
  <link rel="preload" href="/static/fonts/jost-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script type="importmap">{ "imports": { "three": "/static/vendor/three/three.module.min.js" } }</script>
  <script type="module" src="/static/vendor/model-viewer.min.js"></script>
  <script type="module" src="/static/editor.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Your models">
      <div class="band">
        <div class="wordmark">Print Studio <small>K2 Pro</small></div>
        <button class="btn on-band" id="new-model" type="button"></button>
      </div>
      <nav class="envelopes" id="envelopes" aria-label="Models"></nav>
    </aside>

    <main class="stage">
      <header class="stage-head" id="stage-head"></header>
      <section class="canvas" id="canvas"></section>
    </main>

    <aside class="decide" id="decide" aria-live="polite">
      <div class="decide-body" id="decide-body"></div>
      <div class="decide-foot" id="decide-foot"></div>
    </aside>
  </div>
  <input type="file" id="file-picker" accept="image/*" hidden>
  <input type="file" id="model-picker" multiple hidden accept=".stl,.3mf,.obj,.mtl,.glb,.gltf,.bin,.ply,.off,.zip,.png,.jpg,.jpeg,.bmp,.tga,.webp">
  <script src="/static/app.js"></script>
</body>
</html>
